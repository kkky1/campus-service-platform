apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: campus
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      # 保持与旧 compose 方案一致的宿主机 8080 入口（k3s 需放宽 node-port 范围）
      nodePort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: campus
  labels:
    app: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        fsGroup: 10001
      containers:
        - name: nginx
          image: ghcr.io/kkky1/campus-service-platform/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: uploads
              mountPath: /data/uploads
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 8Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 250m
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-config
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
