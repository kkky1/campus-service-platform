apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: campus
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: campus
  labels:
    app: backend
spec:
  # 至少 2 副本 + maxUnavailable=0 → 滚动更新零中断（新 Pod 就绪后才摘旧 Pod）。
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # 容器以 uid 10001 运行，fsGroup 让共享 uploads 卷可写
      securityContext:
        fsGroup: 10001
      containers:
        - name: backend
          image: ghcr.io/kkky1/campus-service-platform/backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: MYSQL_DSN
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: REDIS_PASSWORD
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: UPLOAD_DIR
              value: "/data/uploads"
            - name: LOGIN_SKIP_CODE
              value: "true"
            - name: CONFIG_PATH
              value: "/app/config.yaml"
          ports:
            - name: http
              containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: uploads
              mountPath: /data/uploads
          # 就绪探针依赖 MySQL/Redis/Kafka 全部健康，是滚动更新「零中断」的关键
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 8
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # 存活探针只探测进程存活，依赖抖动不触发重启
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
      volumes:
        - name: config
          configMap:
            name: backend-config
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
