apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: campus
data:
  # 连接串由 Deployment 的环境变量（MYSQL_DSN / REDIS_* / KAFKA_BROKERS）覆盖，
  # 此处为兜底默认值，保持与仓库 config.yaml 语义一致。
  config.yaml: |
    server:
      port: 8081
    mysql:
      dsn: "campus:placeholder@tcp(mysql:3306)/hmdp?charset=utf8mb4&parseTime=True&loc=Local"
    redis:
      addr: "redis:6379"
      password: ""
    kafka:
      brokers:
        - "kafka:9092"
    upload:
      dir: /data/uploads
    login:
      skip_code: true
    rag:
      chunk:
        token_num: 256
        overlap_percent: 10
      embedding:
        provider: local
        dim: 384
      llm:
        base_url: "https://api.deepseek.com"
        model: deepseek-chat
      retrieval:
        top_k: 8
        vector_weight: 0.7
        keyword_weight: 0.3
      citation:
        min_sentence_len: 5
        threshold: 0.63
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: campus
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/json;
      sendfile on;
      keepalive_timeout 65;

      server {
        listen 80;
        server_name localhost;

        location / {
          root /usr/share/nginx/html;
          index index.html index.htm;
        }

        # 上传的图片：后端写入 /data/uploads/blogs/...，前端按 /imgs/blogs/... 访问
        # 上传目录没有的文件（种子数据自带图片）回退到前端静态目录
        location /imgs/blogs/ {
          alias /data/uploads/blogs/;
          expires 7d;
          error_page 404 = @static_blogs;
        }

        location @static_blogs {
          root /usr/share/nginx/html;
        }

        location /api {
          default_type application/json;
          proxy_http_version 1.1;
          rewrite /api(/.*) $1 break;
          proxy_pass_request_headers on;
          proxy_next_upstream error timeout;
          proxy_pass http://backend:8081;
        }
      }
    }
