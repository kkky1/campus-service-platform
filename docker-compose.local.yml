services:
  mysql:
    image: mysql:8.0
    container_name: hmdp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: hmdp
    ports:
      - "127.0.0.1:3306:3306"   # 仅本机可访问
    volumes:
      - hmdp-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      # hmdp.sql 含 0000-00-00 零日期（原教学库），需放宽 sql_mode
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: hmdp-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置}
    ports:
      - "127.0.0.1:6379:6379"   # 仅本机可访问（已启用密码）
    volumes:
      - hmdp-redis-data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: bitnami/kafka:3.7
    container_name: hmdp-kafka
    ports:
      - "127.0.0.1:9092:9092"   # 仅本机可访问
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - hmdp-kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    container_name: hmdp-backend
    ports:
      - "127.0.0.1:8081:8081"   # 仅本机可访问（外网经 nginx 8080）
    environment:
      MYSQL_DSN: campus:${MYSQL_APP_PASSWORD}@tcp(mysql:3306)/hmdp?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BROKERS: kafka:9092
      UPLOAD_DIR: /data/uploads
    env_file:
      - path: .env
        required: false
    volumes:
      - hmdp-upload-data:/data/uploads
      - ./db:/initdb:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.front
    container_name: hmdp-nginx
    ports:
      - "8080:80"
    volumes:
      - hmdp-upload-data:/data/uploads:ro
    depends_on:
      - mysql
      - redis
      - kafka
      - backend

volumes:
  hmdp-mysql-data:
    name: hmdp-mysql-data
  hmdp-redis-data:
    name: hmdp-redis-data
  hmdp-kafka-data:
    name: hmdp-kafka-data
  hmdp-upload-data:
    name: hmdp-upload-data
