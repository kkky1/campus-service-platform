name: CI - campus-service-platform

# 说明：部署采用拉取式（pull-based CD）——
# 服务器上的 systemd timer（campus-deploy.timer）每 2 分钟从 GitHub 拉取，
# 有新提交则自动 docker compose 构建部署并健康检查（脚本 /root/campus-deploy.sh）。
# 本工作流负责推送前的质量门禁。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
