name: K8s 部署（可视化打包 + 微服务滚动更新）

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # 允许 GITHUB_TOKEN 推送 ghcr.io 镜像

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ─────────────────────────────────────────────────────────────
  # 阶段一：微服务打包（可视化构建）—— 构建并推送镜像到 ghcr.io
  # ─────────────────────────────────────────────────────────────
  build-push:
    name: 打包并推送镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包后端镜像（backend）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 打包前端镜像（frontend）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.front
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 阶段二：微服务滚动更新 —— SSH 到 K8s 节点执行 set image + rollout status
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: 滚动更新到 K8s
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: 通过 SSH 执行滚动更新
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_SSH_HOST }}
          port: ${{ secrets.K8S_SSH_PORT }}
          username: ${{ secrets.K8S_SSH_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            SHA="${{ github.sha }}"
            REG="ghcr.io/${{ github.repository }}"

            echo "==> 滚动更新后端（backend）"
            kubectl -n campus set image deployment/backend backend=${REG}/backend:${SHA}
            kubectl -n campus rollout status deployment/backend --timeout=180s

            echo "==> 滚动更新前端（frontend）"
            kubectl -n campus set image deployment/frontend nginx=${REG}/frontend:${SHA}
            kubectl -n campus rollout status deployment/frontend --timeout=120s

            echo ""
            echo "==> 部署后的工作负载状态（可视化）"
            kubectl -n campus get deploy,rs,pods -o wide

            echo ""
            echo "==> 应用状态页数据"
            curl -sf http://127.0.0.1:8080/api/deploy/status | head -c 2000 || true
